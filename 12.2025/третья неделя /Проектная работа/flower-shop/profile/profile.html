<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Личный кабинет</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <link rel="stylesheet" href="profile.css">
</head>
<body>

    <div class="profile-container">
        <h1>Личный кабинет</h1>
        <div class="profile-info">
            <div><strong>Имя:</strong> <span id="usernameDisplay">Гость</span></div>
            <div><strong>Email:</strong> <span id="emailDisplay">не указан</span></div>
        </div>
    
        <div class="password-change">
            <h3>Сменить пароль</h3>
            <div>
                <input type="password" id="currentPassword" class="input-field" placeholder="Текущий пароль">
            </div>
            <div>
                <input type="password" id="newPassword" class="input-field" placeholder="Новый пароль">
            </div>
            <div>
                <input type="password" id="confirmNewPassword" class="input-field" placeholder="Подтвердите новый пароль">
            </div>
            <div>
                <button id="savePasswordBtn" class="btn btn-save">Сохранить новый пароль</button>
            </div>
            <div>
                <button id="backPasswordBtn" class="btn btn-back">Вернутся на главную</button>
            </div>
        </div>
    </div>

<script src="profile.js"></script>

</body>
</html>
