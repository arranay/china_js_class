<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="auth.css">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="auth.js" defer></script>
    <title>Авторизация | Интернет-магазин цветов</title>
</head>
<body>
    <div class="auth-container">
        <h1>Вход или регистрация</h1>
        <form id="auth-form">
            <input type="email" id="email" placeholder="Введите email" required>
            <input type="password" id="password" placeholder="Введите пароль" required>
            <button type="submit" id="login-btn">Войти</button>
            <p>Нет аккаунта? <a href="" id="register-link">Регистрация</a></p>
        </form>
    </div>
</body>
</html>
